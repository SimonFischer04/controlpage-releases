version: '3'

services:
  db:
    image: postgres:17
    hostname: controlpage-postgres
    container_name: controlpage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: controlpage
      POSTGRES_USER: controlpageuser
      POSTGRES_PASSWORD: 6xovUH2QmUZooPTyYrpD9Js8fZRrMBrkqHzs4soRdP
    # ports:
    #   - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    hostname: mariadb-controlpage-adminer
    container_name: controlpage_adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - 8080:8080

  frontend:
    image: gitlab-registry.fischerserver.eu/controlpage/controlpage-releases/frontend:latest
    container_name: controlpage_frontend
    hostname: controlpage-frontend
    restart: on-failure
    depends_on:
      - backend
    ports:
      - 8008:80

  backend:
    image: gitlab-registry.fischerserver.eu/controlpage/controlpage-releases/backend:latest
    container_name: controlpage_backend
    hostname: controlpage-backend
    depends_on:
      - db
    ports:
      - 42000:42000
    environment:
      - DB_HOST=controlpage-postgres

volumes:
  pgdata:
