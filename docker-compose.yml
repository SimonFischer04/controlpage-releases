version: '3'

services:
  db:
    image: postgres:18
    hostname: postgres-controlpage
    container_name: controlpage_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=controlpage
      - POSTGRES_USER=ControlPageUser
      - POSTGRES_PASSWORD=DYxH2NgFh7A55BEqUYAMGPxPxLv6fD3DeCa487LWMD
    volumes:
      # since PostgreSQL 18 the image keeps its data below /var/lib/postgresql (in 18/docker)
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ControlPageUser", "-d", "controlpage"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer
    hostname: postgres-controlpage-adminer
    container_name: controlpage_adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - 8080:8080

  frontend:
    image: gitlab-registry.fischerserver.eu/controlpage/controlpage-releases/frontend:latest
    container_name: controlpage_frontend
    hostname: controlpage-frontend
    restart: on-failure
    depends_on:
      - backend
    ports:
      - 8008:80

  backend:
    image: gitlab-registry.fischerserver.eu/controlpage/controlpage-releases/backend:latest
    container_name: controlpage_backend
    hostname: controlpage-backend
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 42000:42000
    environment:
      - DB_HOST=postgres-controlpage
      # same as POSTGRES_USER / POSTGRES_PASSWORD of the db
      - SPRING_DATASOURCE_USERNAME=ControlPageUser
      - SPRING_DATASOURCE_PASSWORD=DYxH2NgFh7A55BEqUYAMGPxPxLv6fD3DeCa487LWMD

volumes:
  postgres_data:
