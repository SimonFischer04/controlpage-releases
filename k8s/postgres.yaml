# The database of the backend.
#
# Needs a secret "postgres-secret" (secret.yaml, not part of this repository) with the keys:
#   database: controlpage
#   username / password: have to match what the backend connects with
#                        (application.yml of the backend, or SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: controlpage
spec:
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: controlpage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: postgres-persistent-storage
              # since PostgreSQL 18 the image keeps its data below /var/lib/postgresql (in 18/docker),
              # so a lost+found directory of the volume does not get in the way
              mountPath: /var/lib/postgresql
      volumes:
        - name: postgres-persistent-storage
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: controlpage
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
